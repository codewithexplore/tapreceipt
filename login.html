<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Shop Setup - Tap Receipt</title>
  <meta name="description" content="Shopkeeper login and store profile setup for Tap Receipt smart billing system.">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .auth-card {
      max-width: 480px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-xl);
      padding: 2.25rem;
      box-shadow: var(--shadow-lg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .auth-tabs {
      display: flex;
      background: rgba(15, 23, 42, 0.6);
      padding: 0.35rem;
      border-radius: var(--radius-md);
      margin-bottom: 1.75rem;
      border: 1px solid var(--card-border);
    }
    .auth-tab-btn {
      flex: 1;
      padding: 0.65rem 0.5rem;
      text-align: center;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: var(--transition);
    }
    .auth-tab-btn.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.4);
    }
  </style>
</head>
<body data-page="login">

  <div class="auth-wrapper">
    <div class="auth-card">
      
      <!-- Brand Header -->
      <div style="text-align: center; margin-bottom: 1.75rem;">
        <div style="display: inline-flex; align-items: center; gap: 0.75rem; margin-bottom: 0.5rem;">
          <div class="brand-icon">⚡</div>
          <span style="font-family: var(--font-heading); font-size: 1.6rem; font-weight: 800; color: #fff;">
            Tap<span style="color: var(--primary);">Receipt</span>
          </span>
        </div>
        <p style="color: var(--text-muted); font-size: 0.9rem;">
          Smart Digital Billing & Instant WhatsApp Receipt System
        </p>
      </div>

      <!-- Quick Demo Access Banner -->
      <div style="background: rgba(99, 102, 241, 0.12); border: 1px solid rgba(99, 102, 241, 0.3); border-radius: var(--radius-md); padding: 0.75rem 1rem; margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: space-between;">
        <div style="font-size: 0.82rem; color: #c7d2fe;">
          <strong>Demo Shopkeeper:</strong> <code>demo / demo123</code>
        </div>
        <button type="button" id="btn-demo-login" class="btn btn-sm btn-accent">
          One-Click Demo ⚡
        </button>
      </div>

      <!-- Switch Tabs: Login vs Register -->
      <div class="auth-tabs">
        <button type="button" id="tab-login" class="auth-tab-btn active">Shopkeeper Login</button>
        <button type="button" id="tab-register" class="auth-tab-btn">Register New Shop</button>
      </div>

      <!-- 1. Login Form -->
      <form id="form-login">
        <div class="form-group">
          <label for="login-username" class="form-label">Username</label>
          <input 
            type="text" 
            id="login-username" 
            class="form-input" 
            placeholder="e.g. demo" 
            required 
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <label for="login-password" class="form-label">Password</label>
          <input 
            type="password" 
            id="login-password" 
            class="form-input" 
            placeholder="••••••••" 
            required 
            autocomplete="current-password"
          >
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.5rem;">
          <span>🔓</span> Sign In to Dashboard
        </button>
      </form>

      <!-- 2. Register Form -->
      <form id="form-register" style="display: none;">
        <div class="form-group">
          <label for="reg-shop-name" class="form-label">Shop / Store Name *</label>
          <input 
            type="text" 
            id="reg-shop-name" 
            class="form-input" 
            placeholder="e.g. Metro Supermarket" 
            required
          >
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="reg-username" class="form-label">Owner Username *</label>
            <input 
              type="text" 
              id="reg-username" 
              class="form-input" 
              placeholder="e.g. metro_owner" 
              required
            >
          </div>
          <div class="form-group">
            <label for="reg-password" class="form-label">Password *</label>
            <input 
              type="password" 
              id="reg-password" 
              class="form-input" 
              placeholder="Min 4 characters" 
              required
            >
          </div>
        </div>

        <div class="form-group">
          <label for="reg-phone" class="form-label">Shop Contact / WhatsApp Number</label>
          <input 
            type="tel" 
            id="reg-phone" 
            class="form-input" 
            placeholder="e.g. 9876543210"
          >
        </div>

        <div class="form-group">
          <label for="reg-address" class="form-label">Shop Address</label>
          <input 
            type="text" 
            id="reg-address" 
            class="form-input" 
            placeholder="e.g. Shop #5, MG Road, Bengaluru"
          >
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="reg-upi" class="form-label">Shop UPI ID (for QR)</label>
            <input 
              type="text" 
              id="reg-upi" 
              class="form-input" 
              placeholder="e.g. shopname@upi"
            >
          </div>
          <div class="form-group">
            <label for="reg-gst" class="form-label">GSTIN (Optional)</label>
            <input 
              type="text" 
              id="reg-gst" 
              class="form-input" 
              placeholder="e.g. 29AAAAA0000A1Z5"
            >
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.5rem;">
          <span>🚀</span> Create Shop & Launch
        </button>
      </form>

      <!-- Footer Info -->
      <div style="text-align: center; margin-top: 1.75rem; font-size: 0.78rem; color: var(--text-dim);">
        Tap Receipt v2.0 • Smart Digital Billing System
      </div>

    </div>
  </div>

  <div id="toast-container"></div>
  <script src="js/app.js"></script>
</body>
</html>
